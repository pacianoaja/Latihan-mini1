
services:
  # Service 1: Database PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: etl_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
        interval: 5s
        timeout: 5s
        retries: 5

  # Service 2: Application Python ETL
  etl_app:
    build: .
    container_name: etl_python_app
    env_file:
      - .env
    environment:
      DB_HOST: postgres_db  # Otomatis ngobrol ke container postgres_db di dalam jaringan Docker
    depends_on:
      - postgres_db

volumes:
  postgres_data: